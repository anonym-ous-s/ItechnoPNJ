<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BANBAN Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="container">
      <div class="login-left">
        <div class="logo">
          <div class="logo-container">
            <img src="/assets/logo.png" alt="" />
          </div>
        </div>

        <div class="login-header">
          <h1>Sign in to BANBAN</h1>
          <p>Enter your personal details and start journey with us</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <input
              type="email"
              class="form-control"
              placeholder="Email"
              required
            />
          </div>
          <div class="form-group">
            <input
              type="password"
              class="form-control"
              placeholder="Password"
              required
            />
          </div>
          <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="divider">
          <div class="divider-line"></div>
          <div class="divider-text">Atau Lanjutkan Dengan</div>
          <div class="divider-line"></div>
        </div>

        <div class="social-login">
          <button class="social-btn">f</button>
          <button class="social-btn">G</button>
        </div>

        <div class="login-footer">
          <p>Belum Punya Akun? <a href="signup.html">Sign Up</a></p>
        </div>
      </div>

      <div class="login-right"></div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = this.querySelector('input[type="email"]').value;
          const password = this.querySelector('input[type="password"]').value;

          if (email && password) {
            alert("Login successful!\nEmail: " + email);
            this.reset();
          } else {
            alert("Please fill in all fields");
          }
        });

      document.querySelectorAll(".social-btn").forEach((btn) => {
        btn.addEventListener("mouseenter", function () {
          this.style.transform = "scale(1.1)";
          this.style.transition = "all 0.3s ease";
        });

        btn.addEventListener("mouseleave", function () {
          this.style.transform = "scale(1)";
        });
      });
    </script>
  </body>
</html>
