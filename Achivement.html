<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Achievements — BANBAN</title>

    <!-- FontAwesome untuk ikon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f8faff;
      }

      .sidebar {
        width: 240px;
        height: 100vh;
        background: #0a73b7;
        color: #fff;
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        padding: 20px;
      }

      .sidebar h2 {
        font-size: 18px;
        margin-bottom: 30px;
        text-align: center;
      }

      .sidebar a {
        color: #fff;
        text-decoration: none;
        padding: 10px;
        display: block;
        margin: 5px 0;
        border-radius: 8px;
        transition: 0.3s;
      }

      .sidebar a:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .content {
        margin-left: 260px;
        padding: 30px;
      }

      .content h1 {
        font-size: 28px;
        margin-bottom: 40px;
      }

      .achievements {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 20px;
      }

      .card {
        width: 220px;
        padding: 20px;
        text-align: center;
        background: #e5f2ff;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        position: relative;
      }

      .card img {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
      }

      .crown {
        position: absolute;
        top: -25px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 28px;
      }

      .first {
        background: #2b7dbc;
        color: #fff;
        transform: scale(1.1);
      }

      .level {
        font-size: 14px;
        margin: 5px 0;
      }

      .xp {
        font-size: 18px;
        font-weight: bold;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>BANBAN</h2>
      <p style="font-size: 14px; text-align:center;">banban@gmail.com</p>
      <a href="#">Dashboard</a>
      <a href="#">Pomodoro Timer</a>
      <a href="#">Study Groups</a>
      <a href="#">Materials</a>
      <a href="#">Achievement</a>
      <a href="#">Settings and Profile</a>
    </div>

    
    <div class="content">
      <h1>Achievements</h1>
      <div class="achievements">
       
        <div class="card">
          <div class="crown">👑</div>
          <img src="elgin.jpg" alt="elgin" />
          <h3>Elgin Cynthia </h3>
          <p class="level">Level 26</p>
          <p class="xp">1,150 XP</p>
        </div>

        <div class="card first">
          <div class="crown">👑</div>
          <img src="intan.jpg" alt="intankirre/DemosKir24/struktur/elgin.jpg" />
          <h3>Intan Nur Hikmah</h3>
          <p class="level">Level 28</p>
          <p class="xp">1,250 XP</p>
        </div>

        <div class="card">
          <div class="crown">👑</div>
          <img src="ilham.jpg" alt="ilham" />
          <h3>Kumbang</h3>
          <p class="level">Level 10</p>
          <p class="xp">1,000 XP</p>
        </div>
      </div>
    </div>
  </body>
</html>
